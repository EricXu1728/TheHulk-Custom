<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northstar Report Preview</title>
    <style>
      body { margin: 0; background: #f3f6fa; color: #172b4d; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 760px; margin: 48px auto; padding: 24px; }
      .banner { padding: 18px 22px; border: 2px solid #238636; border-radius: 10px; color: #14532d; background: #e9f8ee; }
      .banner strong { display: block; font-size: 1.2rem; }
      .card { margin-top: 22px; padding: 24px; border: 1px solid #d9e2ec; border-radius: 12px; background: white; }
      img { display: block; width: 100%; height: auto; margin-top: 18px; border-radius: 8px; }
      code { overflow-wrap: anywhere; }
      a { color: #0b5cad; }
    </style>
  </head>
  <body>
    <main>
      <div class="banner" id="proof">
        <strong>DOM-CLOBBERING CHAIN TRIGGERED</strong>
        The app followed a URL supplied through the saved named link.
      </div>
      <section class="card">
        <h1>Quarterly report preview</h1>
        <p>This image is a harmless local asset. The visible URL change and this page show the final navigation effect.</p>
        <p>Destination: <code id="destination"></code></p>
        <img src="/report-chart.svg" alt="A sample quarterly report chart showing four colored bars">
        <p><a href="/">Return to the support case</a></p>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("destination").textContent = location.href;
      if (params.get("via") !== "dom-clobber") {
        const proof = document.getElementById("proof");
        proof.querySelector("strong").textContent = "Local report preview";
        proof.lastChild.textContent = " This page was opened without the demo chain marker.";
      }
    </script>
  </body>
</html>
